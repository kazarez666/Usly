<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0a12"><title>Usly · Фото пары</title>
<style>html,body{margin:0;width:100%;height:100%;background:#07070b;color:#fff;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center;overflow:hidden}.frame{width:100%;height:100%;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#27152d,#08080c 55%)}img{width:100%;height:100%;object-fit:cover;display:none}.empty{padding:28px;text-align:center;color:#a7a0ad}.empty strong{display:block;color:#fff;font-size:22px;margin-bottom:8px}.top{position:absolute;left:18px;right:18px;top:18px;z-index:2;display:flex;justify-content:space-between;align-items:center}.pill{padding:8px 11px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(0,0,0,.32);backdrop-filter:blur(12px);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.refresh{border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.32);color:#fff;border-radius:999px;padding:8px 11px}.hint{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;padding:10px 12px;border-radius:14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));font-size:11px;color:rgba(255,255,255,.72)}</style>
</head><body><main class="frame"><div class="top"><span class="pill">USLY · ВАШЕ ФОТО</span><button class="refresh" onclick="render()">↻</button></div><img id="photo" alt="Последнее фото пары"><div id="empty" class="empty"><strong>Последнее фото пары</strong><span>Откройте Usly и отправьте первое фото.</span></div><div class="hint">Экран последнего фото · обновляется при открытии</div></main>
<script>function render(){const keys=Object.keys(localStorage).filter(k=>k.startsWith('usly-latest-photo-'));const url=keys.map(k=>localStorage.getItem(k)).find(Boolean);const img=document.getElementById('photo'),empty=document.getElementById('empty');if(url){img.src=url;img.style.display='block';empty.style.display='none'}else{img.style.display='none';empty.style.display='block'}}render();setInterval(render,15000)</script></body></html>
